<h2>CTF Challenges</h2>
<p class="c-sub">Twenty-seven puzzles across Crypto, Web, Stego and Forensics, from warm-up to brutal. Each hides a flag shaped like NTV{...}. Some come with a file to download and analyse. The Security Tools page helps, but the harder ones will not be solved for you.</p>

(function(){
var CH=[{"t": "First Contact", "p": 10, "h": "beea1797f70270bb373c9348a7eecd883397dd02e1b3b34ee9100b2efe0023fe", "d": "TlRWe2Jhc2U2NF9pc19ub3RfZW5jcnlwdGlvbn0=", "i": "Letters, digits, a plus, a slash, and sometimes equals signs at the very end. This encoding is used to carry data inside emails and web pages.", "l": "Easy", "g": "Crypto"}, {"t": "Intercepted Message", "p": 15, "h": "e14e35e786b382f571bfd31c55c44df09f39b0271bbed2b233db289d6bea221f", "d": "AGI{pnrfne_jnf_n_ebzna}", "i": "A Roman general shifted every letter by the same number to hide his messages. Try 13, exactly halfway round the alphabet.", "l": "Easy", "g": "Crypto"}, {"t": "Machine Whispers", "p": 15, "h": "0c93e1a1c081ca53d959a2a7205a5ea7253091db2a56c9d323d1a6fc9092bf62", "d": "4e54567b6865785f69735f6a7573745f62797465737d", "i": "Only 0-9 and a-f, always in pairs. Each pair is one byte, and each byte is one character.", "l": "Easy", "g": "Crypto"}, {"t": "Locked Room", "p": 20, "h": "34139bb8168841db9d73953bda46bc295494dced3d9853932ede9d648198b162", "d": "UAC{iybal_mvyjl_dpuz}", "i": "The letters were shifted, but nobody told you by how much. There are only 25 possible shifts. Try them all and look for the one that reads like English.", "l": "Easy", "g": "Crypto"}, {"t": "Hidden in Plain Sight", "p": 25, "h": "90ea5c1dedff5269b13e7c1c75ba34ac45afd3c727b457068b40b199d9c3d877", "d": null, "i": "Not everything a page contains is shown on screen. View the page source or use your browser inspect tool, and look for a comment.", "l": "Easy", "g": "Web"}, {"t": "Night Signal", "p": 20, "h": "acd2cec6467133435528911a4f88b6f6c36190862650e8a80a9de5368ffbc68e", "d": "01001110 01010100 01010110 01111011 01100010 01101001 01101110 01100001 01110010 01111001 01011111 01110011 01110000 01100101 01100001 01101011 01110011 01111101", "i": "Only 0 and 1. Split them into groups of eight, and each group is the number of one character.", "l": "Easy", "g": "Crypto"}, {"t": "Looking Glass", "p": 15, "h": "90e19fbc021552 y capital letters and the digits 2 to 7.", "g": "Crypto"}, {"t": "The Vault", "l": "Medium", "p": 40, "h": "d075c05415907e336c08d322f03b881cca29462d92496e43f4c6a492a2e2f60c", "d": "MD5: faa4b0d94da61f59fb40c180a90fda47", "i": "You cannot reverse a hash with maths, but people reuse weak passwords, and leaked passwords are collected in huge lookup databases. Search the hash online.", "g": "Crypto"}, {"t": "Tail End", "g": "Stego", "l": "Medium", "p": 40, "h": "69f7eaa5f5cf2c8591a1c2c471e6491f8f32009fcb87cf12993c8c0d8ccb155c", "d": "", "i": "An image file has a clear ending marker, and viewers stop reading there. Whatever comes after it is never displayed. Open the file in a hex editor, or use strings, and look at the very end. What you find is itself encoded.", "f": {"n": "tail.png", "m": "image/png", "b": "iVBORw0KGgoAAAANSUhEUgAAAKAAAABkCAIAAACO1KzYAAAJY0lEQVR42u2WaXeW1RWGzw+rWhywxYpWtNi88zynRSui1qE4YItWnICEJBACJCFkICEkJAEpIk6IWCgyCChDERAoiEj7qfc+9/uc/Ie99lp7nXW+X+u61+VW3RFb+YuWlXe0rMLd2bL6rtjqu/C2tP1Srv3uWPscvC1r7o6tuSfWcW+8496Y3H2xzvtiXffHu+bilVv7q9i6X8ebNy/ePS++/jeJ7gfwyvU8GN8wP9EzH298w0PxjQ8lNv02ufFhvP4eSfQtSPYuwJvoe1Ru8++S/Y/JK7cwueXx1MDjSdyW38sNxVKDLcnBGD7JoXhyJJEeTqRwI0m5ren01hTe1CgukxrLpseyeFPbcmnceCEznscrt72YnihlJkppuXJ6spzeUc3sqGTkrWamapnpenaqjjcz3cjMNDI7/5CdacUrt+uP2Q8W5XYtwpv94Am5f/wpt/tJvP6eyn64OLdnsbwfPi330TP5vUtye5/BJ/fRs7mPn8vvey6H+/jPcp++UPjk+fwnL+Q/xb2Y/+ylwmcv4c1//he5/S8X9i/Fm//i5cIXrxQOvFo88GpB7rXCl68VDr5ePLgMr9xXfy3882/F5i0vHlpedKC76s4Y6XrA4Boj3TagndMCrqTrAYNrnHQ7gXYuuMZJl4C75yVIF2hxPQ8mSFduvnAlXaDF9T6SJN1e3IJE/6NJ0gVa3MDCFOkOLCTaFOkK2hZwTZHucJxo06Q7ArQpcE2TrgfcRCsHtHlwzZCuBwyuGdKdrKRBd6qWJV25OrhmSRdoceBKunKLsrufyJEu0OL2PJUj3T24xdm9T+dJV9AuAdc86e57lmjzpCtonwfXAul6wOBaIN3PgXZpHlxJ1wMG1yLpfgm0y8C1SLoEfGh5iXQPvQHA3l2IS7p0t31OjHTpLsQlXbrbNTdOunQXXGf1hbgPJEiX7oq4ni7d3fRwknTpbi/E9XTpbv9jSdKluwMQ19Olu4MtKdKlu2Ktp0t3t6bSpEt3IS7pEvB4PkO6dBfiki7dBVfSpbsirqdLd3e2ZkmX7oq4ni7d3f1kjnTp7h6I6+nS3b1L8qRLd/dBXE+X7hJtcBfiki7d3b+0QLp0F+KSLt09uKxIunQXXGf1XV48/EYJdAV \u200b\u200b\u200c\u200b\u200c\u200c\u200b\u200c\u200c\u200c\u200b\u200b\u200c\u200c\u200b\u200c\u200b\u200c\u200c\u200b\u200c\u200c\u200c\u200c\u200c\u200b\u200c", "i": "The sentence is longer than it looks. Some characters take no space on screen. There are two kinds of them, so think 0 and 1.", "g": "Stego"}, {"t": "The Gatekeeper", "l": "Hard", "p": 70, "h": "949f06365dc53c0932f44ca21c348f3cdc9600cb9193f7e758a888ff736f340d", "d": "", "i": "The token is a JWT. Look at its header, it names an algorithm. What if the token claimed it needs no signature at all, and that you are the admin?", "g": "Web"}, {"t": "Static", "g": "Stego", "l": "Hard", "p": 60, "h": "cd36de36d166d5733adf278d6c9a6486bfd23bb0b12bb53b1947d21e8856384f", "d": "", "i": "The picture looks like plain noise, but one tiny part of it is not random. Think about the least significant bit of a colour channel, read in order from the first pixel. Eight bits make one character, and a zero byte ends the message. Try zsteg, or write a short script.", "f": {"n": "static.png", "m": "image/png", "b": "iVBORw0KGgoAAAANSUhEUgAAAIAAAABACAIAAABdtOgoAABKsklEQVR42hyY57KqSruF11V9e++11sw5R3NCAREREwiKiKkj0OQLPj1P1SxqAs2fN4zxDH/92yJ/Wvl5C51/5yfN4KSTXzTz8zY5bZOrOrgV0JkAzwVw1UjuhfS6k13W8EU5v66mL21230xeaulLJXr9Dl/b9KOGP9r+Ryt8KqHXdv5QQ29l8FpPn77hRyf6rBZv3+ylhMtN+F5n1SppfEelGinXs2odN4SiXA8q9bBZjUpC2qmBeouU21G7FgudUGyA3jfoVLNOK2rVqCDEUpWpdax+k14zUIVQrFF+K7QipR0MBNqr+aNGqAhYavqqQNUaMlrxpJxqzXBcS/V6qtaJ/p3Pm+m8E2idbNUups1oVmITIRh/F0YdTht43mSLNnCaqdHCq3LoNOCy4ttNbFfCYxl47cQWwnW12NXhvgbWAlmXoNuAqFTARrStoUM9wdX4UIlAidDvJCzRfS0L2kkowLAOaTtPO5HfSX/9/Q7+a4ZXLXRZD87K4LQW/m7gm3ZxW8d3NfzQApfl4L4Ob0v4oU7Pavi8lD9VeR3hc6t47ATXTfz4Hb2U0X05eGklT7XksZk+1IunOn3rFJ8N8l0nL6W80ii+WvS16r+1is8Kq3bSaiv8qoLvRvJVjku1vFNOWw2/0QL1DmoIsFUJ2h1UqwYNIayWYasM2+W0wV+VwvZ33GtFze9IqCdyyR+0crkcdauIN6DfDMVmPBTicYON2qEsRJNWIbfzUQ3OqnTaJoNaNigRvZ3+3DaYVUZ6h1rNZFYKp3U4+c7tarASCrOWWE204D2oYreEFx1/U0+2ZeIIvtuk27K/rjFLyDb1aN9ix0Zx7DDYAIcK2AjBoVyghr8Tit13QRqYVMmugcg3QK2A
