<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>নাবিল ও তানু: দূরত্ব পার করো</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe4ec;--bg2:#ffc0d3;--card:rgba(255,255,255,.82);--tx:#4a1527;--ac:#e11d48;--ac2:#fb5f86;--mu:#9b6477;--board:#ffd3df;--cell:#fff4f7;--w1:#f9a8c4;--w2:#ec6a96;--chip:rgba(255,255,255,.9);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d0a14;--bg2:#3d1328;--card:rgba(66,24,43,.82);--tx:#ffe4ec;--ac:#fb7185;--ac2:#f43f6e;--mu:#d9a3b3;--board:#53213a;--cell:#6a2c49;--w1:#a63e68;--w2:#7a2349;--chip:rgba(80,30,52,.9)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg span{position:absolute;bottom:-40px;opacity:.55;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
#app{position:relative;z-index:1;width:100%;max-width:420px;padding:16px;text-align:center}
.card{background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.55);border-radius:28px;padding:24px 20px;box-shadow:0 10px 36px rgba(225,29,72,.22);animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
h1{margin:0 0 10px;font-size:27px;line-height:1.3;color:var(--ac);text-shadow:0 2px 10px rgba(225,29,72,.2)}
p{line-height:1.75;margin:8px 0}
button{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border:0;border-radius:999px;padding:13px 22px;font-size:17px;font-weight:600;font-family:inherit;margin:7px 0;cursor:pointer;width:100%;box-shadow:0 6px 16px rgba(225,29,72,.35);transition:transform .12s,box-shadow .12s}
button:active{transform:scale(.96);box-shadow:0 2px 8px rgba(225,29,72,.3)}
.bar{display:flex;justify-content:space-between;gap:6px;max-width:350px;margin:0 auto 8px;font-weight:700;font-size:14px}
.bar span{background:var(--chip);padding:6px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pg{height:6px;max-width:350px;margin:0 auto 10px;background:rgba(225,29,72,.16);border-radius:6px;overflow:hidden}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:6px;transition:width .4s}
#g{display:grid;gap:3px;max-width:350px;margin:0 auto;padding:8px;background:var(--board);border-radius:22px;box-shadow:inset 0 2px 8px rgba(0,0,0,.1),0 10px 26px rgba(225,29,72,.2)}
#g div{aspect-ratio:1;border-radius:8px;background:var(--cell);display:flex;align-items:center;justify-content:center;position:relative}
#g .w{background:linear-gradient(145deg,var(--w1),var(--w2));box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
#g .s{background:#fff;box-shadow:0 0 0 3px var(--ac),0 0 14px var(--ac2);z-index:2}
.hb{display:inline-block;animation:pul 1.3s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.28)}}
.pad{display:grid;grid-template-columns:repeat(3,66px);gap:8px;justify-content:center;margin:16px 0 4px}
.pad button{width:66px;height:56px;padding:0;margin:0;font-size:24px;border-radius:20px}
.pad button:nth-child(5){background:linear-gradient(135deg,#a78bfa,#7c3aed);box-shadow:0 6px 16px rgba(124,58,237,.35)}
.f{width:90%;height:90%;border-radius:50%;object-fit:cover;pointer-events:none;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.gh{border-color:#c084fc;box-shadow:0 0 10px #a855f7;animation:flo 1.6s ease-in-out infinite}
@keyframes flo{50%{transform:translateY(-3px)}}
.big{width:76px;height:76px;margin:0 6px;vertical-align:middle;border-width:3px}
.sm{width:74%;height:74%}
.big.sm{width:62px;height:62px}
.meter{max-width:350px;margin:8px auto 10px;text-align:left;font-size:13px;font-weight:700;color:var(--ac)}.meter-track{height:10px;border-radius:20px;background:rgba(225,29,72,.16);overflow:hidden;margin-top:4px}.meter-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fb7185,#e11d48);border-radius:20px;transition:width .35s}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-width:350px;margin:8px auto}.tools button,.smallbtn{width:100%;margin:0;padding:9px 10px;font-size:14px;border-radius:14px}.tools .pausebtn{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.tools .restartbtn{background:linear-gradient(135deg,#64748b,#334155)}.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.level-grid button{padding:10px 0;margin:0;border-radius:13px;font-size:15px}.level-grid button:disabled{opacity:.35;filter:grayscale(1);box-shadow:none}.overlay{position:fixed;inset:0;z-index:10;background:rgba(20,5,15,.72);display:flex;align-items:center;justify-content:center;padding:22px}.overlay .card{width:min(100%,360px)}.victory{position:relative;overflow:hidden}.victory:before{content:'💗  💖  💞  💕  💗';position:absolute;inset:-15px 0 auto;font-size:26px;white-space:nowrap;opacity:.85;animation:loveRain 2.8s linear infinite;pointer-events:none}.victory h1{animation:heartPop .7s ease-in-out infinite alternate}.victory .letter{position:relative;z-index:1}.confetti{font-size:26px;letter-spacing:8px;animation:heartPop .8s ease-in-out infinite alternate}@keyframes heartPop{to{transform:scale(1.08)}}@keyframes loveRain{from{transform:translateY(-35px)}to{transform:translateY(100vh)}}
.letter{background:#fffaf0;color:#4a2b1a;border-radius:14px;padding:18px;text-align:left;line-height:1.95;border-left:5px solid #f9a8c4;box-shadow:0 4px 14px rgba(0,0,0,.1);font-size:17px}

/* --- One-screen responsive gameplay layout --- */
html, body { width:100%; height:100%; min-height:0; overflow:hidden; }
body { min-height:0; }
#app { height:100vh; height:100dvh; max-height:100dvh; overflow:hidden; padding:6px 10px; }
#app:has(#g) { display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:3px; }
#app:has(#g) .bar { width:100%; flex:0 0 auto; margin:0 auto 2px; font-size:clamp(11px,2.8vw,14px); }
#app:has(#g) .bar span { padding:4px 9px; }
#app:has(#g) .pg { flex:0 0 5px; width:100%; margin:0 auto 2px; }
#app:has(#g) .meter { flex:0 0 auto; width:100%; margin:1px auto 3px; font-size:11px; }
#app:has(#g) .meter-track { height:7px; margin-top:2px; }
#app:has(#g) .tools { flex:0 0 auto; width:100%; margin:1px auto 3px; gap:6px; }
#app:has(#g) .tools button { padding:6px 8px; font-size:13px; min-height:32px; }
#app:has(#g) #g { flex:0 1 auto; min-height:0; max-height:min(350px,calc(100dvh - 390px)); max-width:min(350px,calc(100vw - 24px)); aspect-ratio:1/1; padding:5px; gap:2px; border-radius:16px; }
#app:has(#g) #g div { min-width:0; min-height:0; border-radius:4px; }
#app:has(#g) > p { flex:0 0 auto; margin:0; line-height:1.25; font-size:12px; }
#app:has(#g) .pad { flex:0 0 auto; grid-template-columns:repeat(3,52px); gap:5px; margin:2px auto 0; }
#app:has(#g) .pad button { width:52px; height:42px; font-size:21px; border-radius:14px; }
#app:has(#g) .overlay { overflow:auto; }
#app:not(:has(#g)) { overflow-y:auto; }
@media (max-height:700px) {
  #app { padding-top:3px; padding-bottom:3px; }
  #app:has(#g) { gap:1px; }
  #app:has(#g) .bar { margin-bottom:0; }
  #app:has(#g) .bar span { padding:3px 7px; }
  #app:has(#g) .meter { margin:0 auto 1px; }
  #app:has(#g) .tools { margin:0 auto 1px; }
  #app:has(#g) #g { max-height:min(300px,calc(100dvh - 345px)); padding:4px; gap:1px; }
  #app:has(#g) .pad { grid-template-columns:repeat(3,46px); gap:4px; }
  #app:has(#g) .pad button { width:46px; height:36px; font-size:19px; }
  #app:has(#g) > p { font-size:11px; }
}
@media (max-height:570px) {
  #app:has(#g) .meter { display:none; }
  #app:has(#g) #g { max-height:calc(100dvh - 290px); }
  #app:has(#g) .pad { grid-template-columns:repeat(3,42px); }
  #app:has(#g) .pad button { width:42px; height:32px; font-size:17px; }
}

</style>

function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}if(AC.state=='suspended')AC.resume()}
function loadAudio(){if(!AC)return;['g','n','t','nt','gn','gt'].forEach(function(k){if(BUF[k])return;try{var b=atob(SND[k].split(',')[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);AC.decodeAudioData(u.buffer,function(d){BUF[k]=d},function(){})}catch(e){}})}
function stopSnd(){srcs.forEach(function(s){try{s.stop()}catch(e){}});srcs=[]}
var busyUntil=0,seqEnd=0,tEnd=0,tt;
function setMsg(x){msg=x;var e=document.getElementById('mg');if(e)e.textContent=x}
var turn=0;
function say(a,b,m1,m2){
 var t0=AC.currentTime+0.02,s=AC.createBufferSource(),da=a.duration,db=0;
 s.buffer=a;s.connect(AC.destination);s.start(t0);srcs.push(s);
 if(b){var q=AC.createBufferSource();q.buffer=b;q.connect(AC.destination);q.start(t0+da+0.35);srcs.push(q);db=b.duration+0.35}
 var d=da+db;setMsg(m1);
 if(b)setTimeout(function(){if(!dead)setMsg(m2)},(da+0.35)*1000);
 setTimeout(function(){if(!dead)setMsg('')},d*1000+150);
 return d;
}
function tanuSay(){
 if(paused)return;
 var d=2;
 if(AC&&document.getElementById('g')&&!dead){
  var gt=(turn++)%2==1;
  if(!gt&&BUF.t)d=say(BUF.t,BUF.nt,'👩 নাবিললল, তুমি কোথায়! আমাকে নিয়ে যাও!','🧑 নাবিল বলছে… 🎙️');
  else if(gt&&BUF.g&&BUF.n)d=say(BUF.g,BUF.n,'👻 কোথায় যাস শালার বেটা!','🧑 আন্টি মাফ করে দেন 🙏');
 }
 tt=setTimeout(tanuSay,(d+3+Math.random()*1.5)*1000);
}
function caughtVoice(){
 var B=dead==2?BUF.gt:BUF.gn;
 if(dead&&AC&&B){var s=AC.createBufferSource();s.buffer=B;s.connect(AC.destination);s.start(AC.currentTime+0.05);srcs.push(s)}
}
function playSeq(){
 stopSnd();var t=AC?AC.currentTime+0.15:0,sorry=2000;
 if(AC&&BUF.g){for(var i=0;i<3;i++){var s=AC.createBufferSource();s.buffer=BUF.g;s.connect(AC.destination);s.start(t);srcs.push(s);t+=BUF.g.duration+0.3}
  if(BUF.n){var q=AC.createBufferSource();q.buffer=BUF.n;q.connect(AC.destination);q.start(t);srcs.push(q)}
  sorry=Math.max(0,(t-AC.currentTime)*1000)}
 setTimeout(function(){var e=document.getElementById('sry');if(e)e.style.visibility='visible'},sorry);
}
function hearts(){try{var b=document.getElementById('bg'),h='';for(var i=0;i<14;i++)h+='<span style="left:'+Math.random()*100+'%;animation-duration:'+(10+Math.random()*12)+'s;animation-delay:-'+Math.random()*20+'s;font-size:'+(12+Math.random()*18)+'px">'+(i%3?'💗':'🤍')+'</span>';b.innerHTML=h}catch(e){}}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function save(){try{localStorage.setItem('ntlv',lv);var u=parseInt(localStorage.getItem('ntunlock'))||0;if(lv>u)localStorage.setItem('ntunlock',lv)}catch(e){}}
function saved(){try{return parseInt(localStorage.getItem('ntlv'))||0}catch(e){return 0}}
function getBest(){try{return JSON.parse(localStorage.getItem('ntbest')||'{}')}catch(e){return {}}}
function bestFor(level){var z=getBest();return Number(z[level])||0}
function recordBest(){var z=getBest(),old=Number(z[lv])||0;if(!old||mv<old){z[lv]=mv;try{localStorage.setItem('ntbest',JSON.stringify(z))}catch(e){}}}
function unlocked(){try{return Math.min(15,Math.max(1,(parseInt(localStorage.getItem('ntunlock'))||saved())+1))}catch(e){return Math.min(15,saved()+1)}}
function levelMenu(){var max=unlocked(),h='<div class="card"><h1>🗺️ লেভেল নির্বাচন</h1><p>আনলক করা লেভেল বেছে নাও</p><div class="level-grid">';for(var i=0;i<15;i++){h+='<button '+(i<max?'':'disabled')+' onclick="chooseLevel('+i+')">'+(i<max?(i+1):'🔒')+'</button>'}h+='</div><button class="smallbtn" onclick="start()">← ফিরে যাও</button></div>';app.innerHTML=h}
function chooseLevel(i){if(i>=unlocked())return;lv=i;load()}

var keyCollected=false, keyPos=[0,0], doorPos=[0,0], doorUnlocked=false, doorReached=false, shieldMoves=0, achievementList=[];
function getAchievements(){try{return JSON.parse(localStorage.getItem('ntachievements')||'[]')}catch(e){return []}}
function unlockAchievement(name){var z=getAchievements();if(z.indexOf(name)<0){z.push(name);try{localStorage.setItem('ntachievements',JSON.stringify(z))}catch(e){}}}
function getStars(moves){var target=Math.max(12,Math.floor(n*n*0.55));return moves<=target?3:(moves<=target*1.45?2:1)}
function loveNote(){var notes=['দূরত্ব যতই হোক, শেষ পর্যন্ত তোমার কাছেই ফিরব।','তোমার জন্য প্রতিটা বাধা পার হওয়া যায়।','একসাথে থাকলেই প্রতিটা পথ সুন্দর।','তুমি আমার সবচেয়ে প্রিয় গন্তব্য।','এই যাত্রার সবচেয়ে সুন্দর পুরস্কার তুমি।'];return notes[lv%notes.length]}
function toggleSound(){try{var v=localStorage.getItem('ntsound')!=='off';localStorage.setItem('ntsound',v?'off':'on');msg=v?'🔇 সাউন্ড বন্ধ':'🔊 সাউন্ড চালু';draw()}catch(e){}}
function soundEnabled(){try{return localStorage.getItem('ntsound')!=='off'}catch(e){return true}}

function gen(l){
 n=SZ[l];var r=rng(l*977+13),x,y,i;g=[];
 for(y=0;y<n;y++)g.push(Array(n).fill('#'));
 var st=[[0,0]];g[0][0]='.';
 while(st.length){
  var c=st[st.length-1],d=[[2,0],[-2,0],[0,2],[0,-2]].filter(function(v){var X=c[0]+v[0],Y=c[1]+v[1];return X>=0&&Y>=0&&X<n&&Y<n&&g[Y][X]=='#'});
  if(!d.length){st.pop();continue}
  var v=d[Math.floor(r()*d.length)];
  g[c[1]+v[1]/2][c[0]+v[0]/2]='.';g[c[1]+v[1]][c[0]+v[0]]='.';st.push([c[0]+v[0],c[1]+v[1]]);
 }
 var k=Math.max(0,5-Math.floor(l/2));
 for(i=0;i<k;i++){x=1+Math.floor(r()*(n-2));y=1+Math.floor(r()*(n-2));if((x+y)%2==1)g[y][x]='.'}
 a=[0,0];doorPos=[n-1,n-1];doorUnlocked=false;doorReached=false;
 var D=[],q=[[0,0]],j=0;for(y=0;y<n;y++)D.push(Array(n).fill(-1));D[0][0]=0;
 while(j<q.length){var p=q[j++];[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(v){var X=p[0]+v[0],Y=p[1]+v[1];if(X>=0&&Y>=0&&X<n&&Y<n&&g[Y][X]=='.'&&D[Y][X]<0){D[Y][X]=D[p[1]][p[0]]+1;q.push([X,Y])}})}
 var endD=D[n-1][n-1],prevs=[[n-2,n-1],[n,n-1],[n-1,n-2],[n-1,n]];
 b=prevs.filter(function(c){return c[0]>=0&&c[1]>=0&&c[0]<n&&c[1]<n&&g[c[1]][c[0]]=='.'&&D[c[1]][c[0]]==endD-1})[0]||[n-2,n-1];
 var need=endD-1,f=Math.max(1.25,1.7-l*0.04);lim=Math.ceil(need*f)+2;
 var h=Math.floor(n/2),t=0;
 while(t<h){x=Math.floor(r()*n);y=Math.floor(r()*n);if(g[y][x]=='.'&&!(x==0&&y==0)&&!(x==doorPos[0]&&y==doorPos[1])&&!(x==b[0]&&y==b[1])){g[y][x]='h';t++}}
 levelHeartTotal=t;levelHeartCollected=0;
 keyCollected=false;keyPos=[-1,-1];
 var keyCandidates=[];
 for(y=0;y<n;y++)for(x=0;x<n;x++)if(g[y][x]=='.'&&!(x==0&&y==0)&&!(x==doorPos[0]&&y==doorPos[1])&&!(x==b[0]&&y==b[1]))keyCandidates.push([x,y]);
 if(keyCandidates.length){keyPos=keyCandidates[Math.floor(r()*keyCandidates.length)];g[keyPos[1]][keyPos[0]]='k'}
 var mid=Math.round(need/2)+1,gx=n>>1,gy=n>>1,bd=999;
 for(y=0;y<n;y++)for(x=0;x<n;x++){if(D[y][x]>=0&&x+y>2&&Math.abs(D[y][x]-mid)<bd){bd=Math.abs(D[y][x]-mid);gx=x;gy=y}}
 gp=[gx,gy];gh=[gx,gy];gc=0;gk=l<5?2:1;lim=9999;gprev=null;dead=0;msg='';
 sel=0;mv=0;
}
function start(){
 var s=saved();
 app.innerHTML='<div class="card"><h1>🌉 দূরত্ব পার করো</h1><p style="margin:4px">'+fc('n',1)+' ❤️ '+fc('t',1)+'</p><p><b>'+NB+'</b> আর <b>'+TN+'</b> দুই প্রান্তে। বাধা পেরিয়ে সব ❤️ সংগ্রহ করে তারপর দুজনকে পাশাপাশি আনো। সব ❤️ ও 🗝️ নিলে 🔒 দরজা খুলবে; দরজায় পৌঁছে তারপর একসাথে হলে লেভেল শেষ! ১৫টা লেভেল, চাল অসীম, আর 👻 পাহারাদার এদিক ওদিক ঘুরে বেড়াবে। ওর গায়ে ঠেকলেই গেম ওভার!</p><button onclick="lv=0;hs=0;save();load()">নতুন করে শুরু</button>'+(s>0?'<button onclick="lv='+s+';load()">লেভেল '+(s+1)+' থেকে চালিয়ে যাও</button>':'')+'<button onclick="levelMenu()">🗺️ লেভেল নির্বাচন</button></div>';
}
function load(){paused=false;stopSnd();au();loadAudio();clearTimeout(tt);tt=setTimeout(tanuSay,3000);gen(lv);draw()}
function pauseGame(){if(paused)return;paused=true;clearTimeout(tt);stopSnd();draw()}
function resumeGame(){if(!paused)return;paused=false;au();loadAudio();clearTimeout(tt);tt=setTimeout(tanuSay,1200);draw()}
function restartLevel(){if(!confirm('এই লেভেলটি আবার শুরু করবে?'))return;load()}
function draw(){
 if(dead)return over();
 var boardSize=Math.max(125,Math.min(350,window.innerWidth-24,window.innerHeight-(window.innerHeight<=570?290:(window.innerHeight<=700?345:390)))),fs=Math.max(8,Math.floor((boardSize/n)*0.62)),dist=Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]),startDist=2*(n-1),love=Math.max(0,Math.min(100,Math.round((1-(dist-1)/(startDist-1))*100))),best=bestFor(lv),h='<div class="bar"><span>লেভেল '+(lv+1)+'/15</span><span>❤️ '+levelHeartCollected+'/'+levelHeartTotal+'</span><span>🗝️ '+(keyCollected?'পাওয়া গেছে':'বাকি')+'</span></div><div class="bar"><span>মোট ❤️ '+hs+'</span><span>চাল: '+mv+'</span><span>🏆 সেরা: '+(best||'—')+'</span></div><div class="bar"><span>🏆 সেরা: '+(best||'—')+'</span><span>💞 Love: '+love+'%</span></div><div class="pg"><i style="width:'+((lv+1)/15*100)+'%"></i></div><div class="meter">💗 Love Meter <span style="float:right">'+love+'%</span><div class="meter-track"><i style="width:'+love+'%"></i></div></div><div class="tools"><button class="pausebtn" onclick="'+(paused?'resumeGame()':'pauseGame()')+'">'+(paused?'▶️ চালু করো':'⏸️ Pause')+'</button><button class="restartbtn" onclick="restartLevel()">↻ Restart</button></div><div id="g" style="width:'+boardSize+'px;grid-template-columns:repeat('+n+',minmax(0,1fr));font-size:'+fs+'px">';
 for(var y=0;y<n;y++)for(var x=0;x<n;x++){
  var c=g[y][x],t='',k='';
  if(c=='#')k='w';else if(c=='h')t='<span class="hb">❤️</span>';else if(c=='k')t='🗝️';
  if(doorPos[0]==x&&doorPos[1]==y)t=doorUnlocked?'🚪':'🔒';
  if(a[0]==x&&a[1]==y){t=fc('n');if(!sel)k='s'}
  if(b[0]==x&&b[1]==y){t=fc('t');if(sel)k='s'}
  if(gp[0]==x&&gp[1]==y)t=fc('g');
  h+='<div class="'+k+'" onclick="pick('+x+','+y+')">'+t+'</div>';
 }
 h+='</div><div class="tools"><button onclick="toggleSound()">'+(soundEnabled()?'🔊 Sound On':'🔇 Sound Off')+'</button><button onclick="levelMenu()">🗺️ Level Select</button></div><p style="color:var(--ac);margin:8px 0 0;min-height:1.7em"><b id="mg">'+msg+'</b></p><p style="color:var(--mu);margin:0">এখন চলছে: <b>'+(sel?TN:NB)+'</b> (অন্যজনকে ট্যাপ করলে বদলাবে)</p><div class="pad"><span></span><button onclick="m(0,-1)">⬆️</button><span></span><button onclick="m(-1,0)">⬅️</button><button onclick="sw()">🔄</button><button onclick="m(1,0)">➡️</button><span></span><button onclick="m(0,1)">⬇️</button><span></span></div>';
 if(paused)h+='<div class="overlay"><div class="card"><h1>⏸️ গেম Pause</h1><p>একটু বিশ্রাম নাও, ভালোবাসার যাত্রা এখানেই অপেক্ষা করছে।</p><button onclick="resumeGame()">▶️ Resume</button><button class="restartbtn" onclick="restartLevel()">↻ Restart Level</button><button onclick="levelMenu()">🗺️ Level Selection</button></div></div>';
 app.innerHTML=h;
}
function pick(x,y){if(paused)return;if(a[0]==x&&a[1]==y)sel=0;else if(b[0]==x&&b[1]==y)sel=1;else return;draw()}
function sw(){if(paused)return;sel=1-sel;draw()}
function m(dx,dy){
 if(paused||dead)return;
 var p=sel?b:a,o=sel?a:b,nx=p[0]+dx,ny=p[1]+dy;
 if(nx<0||ny<0||nx>=n||ny>=n||g[ny][nx]=='#'||(o[0]==nx&&o[1]==ny))return;
 if(nx==doorPos[0]&&ny==doorPos[1]&&!doorUnlocked){setMsg('🔒 দরজাটি বন্ধ! সব ❤️ এবং 🗝️ সংগ্রহ করো।');return}
 p[0]=nx;p[1]=ny;mv++;
 if(g[ny][nx]=='h'){g[ny][nx]='.';hs++;levelHeartCollected++}
 if(g[ny][nx]=='k'){g[ny][nx]='.';keyCollected=true;unlockAchievement('Key Finder')}
 if(levelHeartCollected>=levelHeartTotal&&keyCollected&&!doorUnlocked){doorUnlocked=true;setMsg('🔓 সব সংগ্রহ হয়েছে! দরজা খুলে গেছে।')}
 if(nx==doorPos[0]&&ny==doorPos[1]&&doorUnlocked)doorReached=true;
 if(Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])==1){
  if(levelHeartCollected>=levelHeartTotal&&keyCollected&&doorUnlocked){
   if(doorReached)return win();
   setMsg('🚪 আগে খোলা দরজায় পৌঁছাও, তারপর একসাথে হও।');draw();return;
  }
  // Reuniting before collecting every heart and the key triggers the guard.
  gp=[nx,ny];dead=3;return over();
 }
 if(nx==gp[0]&&ny==gp[1])caught(p);
 else{gc++;if(gc%gk==0){gstep();if(a[0]==gp[0]&&a[1]==gp[1])caught(a);else if(b[0]==gp[0]&&b[1]==gp[1])caught(b)}}
 draw();
}
document.addEventListener('keydown',function(e){var d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(!document.getElementById('g')||paused)return;if(d){e.preventDefault();m(d[0],d[1])}else if(e.key==' '){e.preventDefault();sw()}});
function gstep(){
 var targets=[a,b],bestPath=null,bestLen=1e9;
 targets.forEach(function(target){
  var Q=[[gp[0],gp[1]]],prev={},seen={},i=0,startKey=gp[0]+','+gp[1];
  seen[startKey]=1;
  while(i<Q.length){
   var c=Q[i++],K=c[0]+','+c[1];
   if(c[0]==target[0]&&c[1]==target[1]){
    var path=[],cur=K;
    while(cur!==startKey){var xy=cur.split(',').map(Number);path.push(xy);cur=prev[cur]}
    path.reverse();
    if(path.length<bestLen){bestLen=path.length;bestPath=path}
    break;
   }
   [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(v){
    var X=c[0]+v[0],Y=c[1]+v[1],NK=X+','+Y;
    if(X>=0&&Y>=0&&X<n&&Y<n&&g[Y][X]!='#'&&!(X==doorPos[0]&&Y==doorPos[1]&&!doorUnlocked)&&!seen[NK]){
     seen[NK]=1;prev[NK]=K;Q.push([X,Y]);
    }
   });
  }
 });
 if(bestPath&&bestPath.length)gp=bestPath[0];
}
function caught(p){
 var o=p===a?b:a,sx=p===a?0:n-1;
 if(!(o[0]==sx&&o[1]==sx)){p[0]=sx;p[1]=sx}
 dead=(p===a?1:2);
}
function over(){clearTimeout(tt);var line=dead==3?'কোথায় যাস শালার বেটা! তোর বাপরে বলতাছি, দাঁড়া, আজ আসুক!':(dead==2?'এই মেয়ে, তোর আজ খবর আছে! তোর বাপরে বলতাছি, দাঁড়া, আজ আসুক!':'কিরে নাবিল বেটা, তোরে আজ খাইসি!');app.innerHTML='<div class="card"><h1>👻 গেম ওভার</h1><p style="font-size:19px"><b>'+line+'</b></p><p>'+(dead==3?'সব ❤️ এবং 🗝️ সংগ্রহ করার আগেই একসাথে হতে গিয়েছিলে! আগে সব সংগ্রহ করো।':'এই লেভেলটা আবার শুরু করতে হবে।')+'</p><p style="margin:4px">'+fc('g',1)+'</p><button onclick="load()">আবার চেষ্টা 🔁</button></div>';stopSnd();caughtVoice()}
function gpatrol(){
 var o=[];[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(v){var X=gp[0]+v[0],Y=gp[1]+v[1];if(X>=0&&Y>=0&&X<n&&Y<n&&g[Y][X]!='#'&&!(X==doorPos[0]&&Y==doorPos[1]&&!doorUnlocked))o.push([X,Y])});
 var f=o.filter(function(c){return !(gprev&&c[0]==gprev[0]&&c[1]==gprev[1])});
 if(f.length)o=f;
 var c=o[Math.floor(Math.random()*o.length)];gprev=gp;gp=c;
}
function lose(){app.innerHTML='<div class="card"><h1>😢 চাল শেষ</h1><p>এবার হলো না। সোজা পথ খুঁজে আবার চেষ্টা করো, হার্ট ছাড়লেও চলবে।</p><button onclick="load()">আবার চেষ্টা 🔁</button></div>'}
function win(){
 if(levelHeartCollected<levelHeartTotal||!keyCollected||!doorUnlocked||!doorReached){dead=3;return over()}
 clearTimeout(tt);recordBest();paused=false;stopSnd();
 unlockAchievement('First Reunion');
 if(levelHeartCollected===levelHeartTotal)unlockAchievement('Heart Collector');
 if(getStars(mv)===3)unlockAchievement('Perfect Escape');
 if(lv===14)unlockAchievement('15 Levels Completed');
 if(lv<14){app.innerHTML='<div class="card victory"><div class="confetti">💗 ✨ 💖 ✨ 💗</div><h1>🥰 দেখা হলো!</h1><p>'+NB+' আর '+TN+' পাশাপাশি। '+mv+' চালে পার করলে।</p><p>🏆 সেরা চাল: '+bestFor(lv)+'</p><p style="color:var(--mu)">'+M[lv]+'</p><button onclick="lv++;save();load()">পরের লেভেল ➡️</button><button onclick="levelMenu()">🗺️ লেভেল নির্বাচন</button></div>';return}
 save();lv=0;
 app.innerHTML='<div class="card victory"><div class="confetti">💗 ✨ 💖 ✨ 💗</div><h1>💞 অবশেষে একসাথে</h1><p style="margin:4px">'+fc('n',1)+' ❤️ '+fc('t',1)+'</p><p>১৫টা দূরত্বই পার হলো। মোট ❤️ '+hs+'টা।</p><div class="letter">প্রিয় '+TN+',<br>মাঝে যত বাধাই আসুক, আমি প্রতিবার তোমার কাছেই ফিরে আসব। তুমি আছো বলেই প্রতিটা পথ সুন্দর।<br><br>তোমার '+NB+' ❤️</div><p>🏆 সব লেভেলের সেরা স্কোর সংরক্ষিত থাকবে।</p><button onclick="start()">আবার খেলি</button><button onclick="levelMenu()">🗺️ লেভেল নির্বাচন</button></div>';
}
hearts();
start();
</script>
